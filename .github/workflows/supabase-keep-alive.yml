# Keeps the Champagne Island Supabase project awake.
# Supabase pauses free projects after about 7 days of low activity.
# Read-only pings were not enough on the Lita's project, so this calls
# keep_alive(), which makes a tiny WRITE, once a day.
#
# Put this file in your repo at:  .github/workflows/supabase-keep-alive.yml
# Run keep-alive.sql in the Supabase SQL Editor first.
# Then add two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (never the service_role key)

name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC (8:17 am Belize)
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database if it is awake
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          case "$URL" in https://*.supabase.co) ;; *) echo "SUPABASE_URL secret is missing or wrong."; exit 1 ;; esac
          [ -n "$KEY" ] || { echo "SUPABASE_ANON_KEY secret is missing."; exit 1; }

          CODE=$(curl -sS -m 40 -o body.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "keep_alive() -> HTTP $CODE: $(head -c 200 body.txt)"
          [ "$CODE" = "200" ] && exit 0

          echo "Falling back to a plain read of the reviews table..."
          CODE=$(curl -sS -m 40 -o body.txt -w "%{http_code}" \
            "$URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
          echo "table read -> HTTP $CODE: $(head -c 200 body.txt)"
          [ "$CODE" = "200" ] && exit 0

          echo "Database did not answer. It may be paused: press Restore project in Supabase."
          exit 1
